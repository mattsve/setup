---
technitium_install_script_url: "https://download.technitium.com/dns/install.sh"

# In-guest default (via pct exec). No port in the URL: the collection's modules
# append api_port.
technitium_api_url: "http://localhost"
technitium_api_port: 5380

# Whether API tasks run from the controller over HTTPS instead. Set per play
# by tasks/main.yaml after probing; the guest path is the safe default.
technitium_api_remote: false

# Create via the web console (Administration > Sessions > Create Token); the
# value comes from group_vars/technitium.yaml.
technitium_api_token: ""

# zones, records, apps and DHCP scopes are supplied per host in host_vars/dns01.yaml
# as lists of API-param maps for the matching collection module, e.g.
#   technitium_zones: [{zone: agb.ingenstans.se, type: Primary}]
#   technitium_records: [{name: x.agb.ingenstans.se, zone: agb.ingenstans.se, type: A, ipAddress: 10.1.50.61}]
technitium_zones: []
technitium_records: []

# Terminate TLS on the host itself (DNS-over-TLS isn't HTTP, so caddy can't
# proxy it). Enabled by the certbot tag.
technitium_tls_enabled: "{{ 'certbot' in group_names }}"

technitium_domain: "{{ inventory_hostname }}.hem.ingenstans.se"
technitium_letsencrypt_dir: "/etc/letsencrypt/live/{{ technitium_domain }}"

# Technitium wants a single PKCS#12 bundle, converted from certbot's PEMs. It
# reloads the file on mtime change, so the renewal hook needn't restart anything.
technitium_cert_dir: /etc/dns/certs
technitium_pfx_path: "{{ technitium_cert_dir }}/technitium.pfx"
# Empty: PKCS#12 needs a password syntactically, but the 0600 file permissions
# are the real protection.
technitium_pfx_password: ""

# Owns the bundle so dns.service can read it.
technitium_service_user: dns-server

# Explicit so they sit next to the firewall rules in tofu/agb-pve/dns01.tf.
technitium_web_service_https_port: 53443
technitium_dns_over_tls_port: 853
technitium_dns_over_https_port: 443

# Only Primary zones can be signed. Signing an already-signed zone errors, so
# tasks/main.yaml only signs zones still Unsigned.
technitium_dnssec_zones: []
technitium_dnssec_algorithm: ECDSA
technitium_dnssec_curve: P256
technitium_dnssec_nx_proof: NSEC3

# [{name, url}] of DNS apps; bump the pinned url to upgrade.
technitium_apps: []

# One scope per VLAN (API-param maps). The API creates scopes disabled, so the
# role enables each one.
technitium_dhcp_scopes: []

# DNS blocking. NxDomain so a blocked query behaves correctly for every record
# type without a placeholder address.
technitium_block_list_urls: []
technitium_block_list_update_interval_hours: 24
technitium_blocking_type: NxDomain
# Client IPs exempt from blocking.
technitium_blocking_bypass_list: []
# Manual overrides, independent of the lists above. Add-only: removing an entry
# doesn't un-block/un-allow it on the server (use the delete_*_zone modules or
# the console).
technitium_blocked_zones: []
technitium_allowed_zones: []
# Derived from whether there is anything to block.
technitium_blocking_enabled: "{{ (technitium_block_list_urls | length > 0) or (technitium_blocked_zones | length > 0) }}"

# Clustering (Technitium v14+). Empty role = standalone. The primary owns all
# config; a secondary joins and has it synced, so config tasks are skipped there.
technitium_cluster_role: ""
technitium_manage_config: "{{ technitium_cluster_role != 'secondary' }}"
# Becomes a Primary zone on the primary; cannot be changed later.
technitium_cluster_domain: ""
# This node's name in the cluster: unique, and resolvable by the other nodes.
technitium_node_domain: "{{ inventory_hostname }}.server.agb.ingenstans.se"
# Static address(es) the other nodes reach this one on.
technitium_node_ip_addresses: []
# Secondary only: how to reach the primary for the join.
technitium_cluster_primary_url: ""
technitium_cluster_primary_ip: ""
# Secondary only: the join takes admin credentials, not an API token
# (group_vars/technitium.yaml).
technitium_cluster_admin_username: ""
technitium_cluster_admin_password: ""

# Zones replicate to secondaries only if they are in the cluster catalog zone.
# Zones that predate the init aren't, so the role adds every zone in
# technitium_zones plus these extras (zones Technitium created itself, e.g. the
# reverse zones for DHCP PTR records).
technitium_cluster_extra_zones: []
technitium_cluster_catalog: "{{ ('cluster-catalog.' ~ technitium_cluster_domain) if technitium_cluster_role == 'primary' else '' }}"

# Cluster init renames each node to <hostname>.<cluster domain>, so set exactly
# that or every run fights the cluster. Standalone nodes use technitium_node_domain.
technitium_dns_server_domain: "{{ (inventory_hostname ~ '.' ~ technitium_cluster_domain) if technitium_cluster_role | length > 0 else technitium_node_domain }}"
