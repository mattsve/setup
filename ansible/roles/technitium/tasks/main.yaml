---
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
  tags: technitium_install

- name: Download Technitium DNS Server install script
  get_url:
    url: "{{ technitium_install_script_url }}"
    dest: /tmp/technitium-install.sh
    mode: 0755
    force: true
  tags: technitium_install

- name: Run Technitium DNS Server install script
  command: /tmp/technitium-install.sh
  tags: technitium_install

- name: Enable and start Technitium DNS Server
  systemd:
    name: dns
    state: started
    enabled: true
  tags: technitium_install

- name: Create local cert directory for Technitium's PKCS#12 bundle
  file:
    path: "{{ technitium_cert_dir }}"
    state: directory
    owner: "{{ technitium_service_user }}"
    group: "{{ technitium_service_user }}"
    mode: 0750
  when: technitium_tls_enabled | bool
  tags: technitium_cert

- name: Convert Let's Encrypt certificate to PKCS#12 for Technitium
  # No `creates:` guard, same reasoning as certbot's own cert request task -
  # this is cheap to re-run, and rebuilding it every play keeps it in sync
  # with whatever certbot's live symlink currently points at rather than
  # only refreshing on an actual renewal event.
  command:
    cmd: >
      openssl pkcs12 -export
      -in {{ technitium_letsencrypt_dir }}/fullchain.pem
      -inkey {{ technitium_letsencrypt_dir }}/privkey.pem
      -passout pass:{{ technitium_pfx_password }}
      -name technitium
      -out {{ technitium_pfx_path }}
  when: technitium_tls_enabled | bool
  changed_when: true
  tags: technitium_cert

- name: Set ownership on Technitium's PKCS#12 bundle
  file:
    path: "{{ technitium_pfx_path }}"
    owner: "{{ technitium_service_user }}"
    group: "{{ technitium_service_user }}"
    mode: 0600
  when: technitium_tls_enabled | bool
  tags: technitium_cert

- name: Deploy certbot renewal hook to refresh Technitium's PKCS#12 cert
  template:
    src: certbot-deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/technitium.sh
    owner: root
    group: root
    mode: 0755
  when: technitium_tls_enabled | bool
  tags: technitium_cert

- name: Configure Technitium web console and encrypted DNS protocols
  effectivelywild.technitium_dns.technitium_dns_set_server_settings:
    api_url: "{{ technitium_api_url }}"
    api_token: "{{ technitium_api_token }}"
    webServiceEnableTls: true
    webServiceUseSelfSignedTlsCertificate: false
    webServiceTlsPort: "{{ technitium_web_service_https_port }}"
    webServiceTlsCertificatePath: "{{ technitium_pfx_path }}"
    webServiceTlsCertificatePassword: "{{ technitium_pfx_password }}"
    enableDnsOverTls: true
    enableDnsOverHttps: true
    dnsOverTlsPort: "{{ technitium_dns_over_tls_port }}"
    dnsOverHttpsPort: "{{ technitium_dns_over_https_port }}"
    dnsTlsCertificatePath: "{{ technitium_pfx_path }}"
    dnsTlsCertificatePassword: "{{ technitium_pfx_password }}"
    dnssecValidation: true
  when: technitium_tls_enabled | bool
  tags: technitium_tls_settings

# Clustering (Technitium v14+). The primary owns all config (zones, records,
# DNSSEC, blocking, apps, settings); a secondary joins and has that synced
# onto it, which is why the zone/record/etc. tasks below are skipped there. Every task here is
# a no-op unless technitium_cluster_role is set. Runs before the zone/record
# tasks because init creates the cluster zone that records may live in.
# Everything below talks to Technitium's API over HTTPS from the controller
# (one request per call) rather than through `pct exec` on the guest, which
# costs a connection plus a module transfer per call and made the record loop
# painfully slow. The TLS settings task above stays on the in-container
# localhost path since it is what turns HTTPS on in the first place.
#
# That remote path can't always work: on a rebuilt dns01 or a new dns02 the
# node's name doesn't resolve yet (this very play creates the record), and a
# controller outside the main VLAN can't reach the port at all. So the HTTPS
# endpoint is probed first and the block falls back to localhost via the
# guest, which is slower but always works.
- name: Probe the HTTPS API from the controller
  # Also covers the web service needing a moment to listen after the TLS
  # settings call above.
  ansible.builtin.wait_for:
    host: "{{ technitium_node_domain }}"
    port: "{{ technitium_web_service_https_port }}"
    timeout: 15
  delegate_to: localhost
  become: false
  register: technitium_api_probe
  ignore_errors: true
  when: technitium_tls_enabled | bool
  tags: &technitium_api_tags
    - technitium_cluster
    - technitium_zones
    - technitium_records
    - technitium_dnssec
    - technitium_blocking
    - technitium_dhcp
    - technitium_apps

- name: Pick the API path
  ansible.builtin.set_fact:
    technitium_api_remote: "{{ technitium_api_probe is defined and technitium_api_probe is succeeded }}"
  when: technitium_tls_enabled | bool
  tags: *technitium_api_tags

- name: Technitium API tasks
  delegate_to: "{{ 'localhost' if technitium_api_remote | bool else inventory_hostname }}"
  become: false
  vars:
    technitium_api_url: "{{ ('https://' ~ technitium_node_domain) if technitium_api_remote | bool else 'http://localhost' }}"
    technitium_api_port: "{{ technitium_web_service_https_port if technitium_api_remote | bool else 5380 }}"
  block:
    - name: Set this node's DNS server domain
      effectivelywild.technitium_dns.technitium_dns_set_server_settings:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        dnsServerDomain: "{{ technitium_dns_server_domain }}"
      when: technitium_cluster_role | length > 0
      tags: technitium_cluster

    - name: Get cluster state
      effectivelywild.technitium_dns.technitium_dns_get_cluster_state:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
      register: technitium_cluster_state
      when: technitium_cluster_role | length > 0
      tags: technitium_cluster

    # Init (primary) and join (secondary) are separate tasks, in this order, on
    # purpose: the linear strategy finishes a task on every host before starting
    # the next, so the primary is guaranteed to be initialized by the time the
    # secondary tries to join it.
    - name: Initialize cluster on the primary
      effectivelywild.technitium_dns.technitium_dns_init_cluster:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        cluster_domain: "{{ technitium_cluster_domain }}"
        primary_node_ip_addresses: "{{ technitium_node_ip_addresses }}"
      when:
        - technitium_cluster_role == 'primary'
        - not technitium_cluster_state.cluster_state.clusterInitialized
      tags: technitium_cluster

    - name: Join cluster as secondary
      effectivelywild.technitium_dns.technitium_dns_init_join_cluster:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        secondary_node_ip_addresses: "{{ technitium_node_ip_addresses }}"
        primary_node_url: "{{ technitium_cluster_primary_url }}"
        primary_node_ip_address: "{{ technitium_cluster_primary_ip }}"
        primary_node_username: "{{ technitium_cluster_admin_username }}"
        primary_node_password: "{{ technitium_cluster_admin_password }}"
      no_log: true
      when:
        - technitium_cluster_role == 'secondary'
        - not technitium_cluster_state.cluster_state.clusterInitialized
      tags: technitium_cluster

    - name: Ensure Technitium DNS zones
      effectivelywild.technitium_dns.technitium_dns_zone:
        "{{ {'api_url': technitium_api_url, 'api_port': technitium_api_port, 'api_token': technitium_api_token, 'state': 'present'} | combine(item) }}"
      loop: "{{ technitium_zones }}"
      loop_control:
        label: "{{ item.zone }}"
      when: technitium_manage_config | bool
      tags: technitium_zones

    - name: Add zones to the cluster catalog so secondaries replicate them
      effectivelywild.technitium_dns.technitium_dns_set_zone_options:
        api_url: "{{ technitium_api_url }}"
        api_port: "{{ technitium_api_port }}"
        api_token: "{{ technitium_api_token }}"
        zone: "{{ item }}"
        catalog: "{{ technitium_cluster_catalog }}"
      loop: "{{ (technitium_zones | map(attribute='zone') | list) + technitium_cluster_extra_zones }}"
      when: technitium_cluster_catalog | length > 0
      tags: technitium_zones

    - name: Ensure Technitium DNS records
      effectivelywild.technitium_dns.technitium_dns_record:
        "{{ {'api_url': technitium_api_url, 'api_port': technitium_api_port, 'api_token': technitium_api_token, 'state': 'present'} | combine(item) }}"
      loop: "{{ technitium_records }}"
      loop_control:
        label: "{{ item.name }}"
      when: technitium_manage_config | bool
      tags: technitium_records

    - name: Get current DNSSEC status for zones to sign
      effectivelywild.technitium_dns.technitium_dns_get_dnssec_properties:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        zone: "{{ item }}"
      loop: "{{ technitium_dnssec_zones }}"
      register: technitium_dnssec_status
      when: technitium_manage_config | bool
      tags: technitium_dnssec

    - name: Sign DNSSEC zones that aren't already signed
      effectivelywild.technitium_dns.technitium_dns_sign_zone:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        zone: "{{ item.item }}"
        algorithm: "{{ technitium_dnssec_algorithm }}"
        curve: "{{ technitium_dnssec_curve }}"
        nxProof: "{{ technitium_dnssec_nx_proof }}"
      loop: "{{ technitium_dnssec_status.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: (technitium_manage_config | bool) and item.dnssec_properties.dnssecStatus == 'Unsigned'
      tags: technitium_dnssec

    - name: Configure Technitium DNS blocking
      # blockListUrls can't be set to an empty list directly (the module rejects
      # it) - clearing it requires the explicit clear_ flag instead, which this
      # sets whenever the desired list is empty.
      effectivelywild.technitium_dns.technitium_dns_set_server_settings:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        enableBlocking: "{{ technitium_blocking_enabled }}"
        blockingType: "{{ technitium_blocking_type }}"
        blockListUpdateIntervalHours: "{{ technitium_block_list_update_interval_hours }}"
        blockingBypassList: "{{ technitium_blocking_bypass_list }}"
        blockListUrls: "{{ technitium_block_list_urls }}"
        clear_blockListUrls: "{{ technitium_block_list_urls | length == 0 }}"
      when: technitium_manage_config | bool
      tags: technitium_blocking

    - name: Ensure manually blocked domains
      effectivelywild.technitium_dns.technitium_dns_add_blocked_zone:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        domain: "{{ item }}"
      loop: "{{ technitium_blocked_zones }}"
      when: technitium_manage_config | bool
      tags: technitium_blocking

    - name: Ensure manually allowed domains
      effectivelywild.technitium_dns.technitium_dns_add_allowed_zone:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        domain: "{{ item }}"
      loop: "{{ technitium_allowed_zones }}"
      when: technitium_manage_config | bool
      tags: technitium_blocking

    - name: Ensure Technitium DHCP scopes
      effectivelywild.technitium_dns.technitium_dns_set_dhcp_scope:
        "{{ {'api_url': technitium_api_url, 'api_port': technitium_api_port, 'api_token': technitium_api_token} | combine(item) }}"
      loop: "{{ technitium_dhcp_scopes }}"
      loop_control:
        label: "{{ item.name }}"
      when: technitium_manage_config | bool
      tags: technitium_dhcp

    - name: Enable Technitium DHCP scopes
      effectivelywild.technitium_dns.technitium_dns_enable_dhcp_scope:
        api_url: "{{ technitium_api_url }}"
        api_token: "{{ technitium_api_token }}"
        api_port: "{{ technitium_api_port }}"
        name: "{{ item.name }}"
      loop: "{{ technitium_dhcp_scopes }}"
      loop_control:
        label: "{{ item.name }}"
      when: technitium_manage_config | bool
      tags: technitium_dhcp

    - name: Install Technitium DNS apps
      # No-ops on an app that's already installed rather than updating it -
      # see the update task below for that.
      effectivelywild.technitium_dns.technitium_dns_download_and_install_app:
        "{{ {'api_url': technitium_api_url, 'api_port': technitium_api_port, 'api_token': technitium_api_token} | combine(item) }}"
      loop: "{{ technitium_apps }}"
      loop_control:
        label: "{{ item.name }}"
      when: technitium_manage_config | bool
      tags: technitium_apps

    - name: Update Technitium DNS apps
      # No when: guard needed: download_and_update_app fails against an app
      # that isn't installed, but the task above guarantees it always is by
      # this point.
      effectivelywild.technitium_dns.technitium_dns_download_and_update_app:
        "{{ {'api_url': technitium_api_url, 'api_port': technitium_api_port, 'api_token': technitium_api_token} | combine(item) }}"
      loop: "{{ technitium_apps }}"
      loop_control:
        label: "{{ item.name }}"
      when: technitium_manage_config | bool
      tags: technitium_apps
