---
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

# Install once only: on an already-installed Pulse the installer prompts via
# /dev/tty, which hangs under pct exec's pty with no flag to skip it. Pulse's
# own pulse-update.timer keeps it current.
- name: Check if Pulse is already installed
  stat:
    path: /bin/update
  register: pulse_update_helper

- name: Download Pulse install script
  get_url:
    url: "{{ pulse_install_script_url }}"
    dest: /tmp/pulse-install.sh
    mode: 0755
  when: not pulse_update_helper.stat.exists

- name: Run Pulse install script
  ansible.builtin.shell: /tmp/pulse-install.sh < /dev/null
  when: not pulse_update_helper.stat.exists

# The unit's optional `EnvironmentFile=-/etc/pulse/.env` is the override hook;
# unlike a drop-in it survives install.sh regenerating the unit.
- name: Disable Pulse telemetry
  ansible.builtin.lineinfile:
    path: /etc/pulse/.env
    regexp: "^PULSE_TELEMETRY="
    line: "PULSE_TELEMETRY=false"
    create: true
    mode: "0644"
  notify: Restart Pulse

- name: Enable and start Pulse
  systemd:
    name: pulse
    state: started
    enabled: true
