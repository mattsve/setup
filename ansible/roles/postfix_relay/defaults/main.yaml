---
postfix_relay_host: "smtp.mailbox.org"
postfix_relay_port: 587

# Overridden in host_vars/group_vars.
postfix_relay_username: ""
postfix_relay_password: ""

postfix_relay_use_tls: true

postfix_myhostname: "{{ ansible_hostname }}"
postfix_mydomain: "{{ ansible_domain | default(ansible_hostname) }}"
postfix_originating_domain: "{{ postfix_mydomain }}"
postfix_mynetworks: "127.0.0.0/8 [::ffff:127.0.0.0]/104 [::1]/128"
postfix_destination: ""
postfix_service: postfix

postfix_sasl_auth_enable: "yes"
postfix_sasl_security_options: "noanonymous"
postfix_sasl_password_maps: "hash:/etc/postfix/sasl_passwd"

postfix_smtpd_use_tls: "yes"
postfix_smtp_use_tls: "yes"
postfix_smtp_tls_security_level: "encrypt"
