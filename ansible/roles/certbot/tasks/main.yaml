---
- name: Install certbot and Cloudflare DNS plugin
  package:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: Configure Cloudflare API token for DNS-01 challenge
  template:
    src: cloudflare.ini.j2
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: 0600

- name: Request certificate via Cloudflare DNS-01 challenge
  # No `creates:` guard - a lineage already existing at
  # /etc/letsencrypt/live/{{ certbot_domains[0] }} doesn't mean it covers
  # today's certbot_domains (e.g. reverse-proxy01's cert, expanded from just
  # hem.ingenstans.se to also cover agb.ingenstans.se). --cert-name pins the
  # lineage certbot targets to the same path caddy_letsencrypt_dir/creates
  # used to assume; --expand lets it add newly-added domains to that
  # lineage instead of erroring non-interactively on a domain-set mismatch.
  # certbot's own renewal logic is what makes this idempotent - it only
  # actually reissues when the domain set changed or the cert is due, and
  # deploy hooks (mosquitto/caddy) only fire on an actual reissuance - so
  # running this unconditionally is safe.
  command:
    cmd: >
      certbot certonly
      --dns-cloudflare
      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
      --dns-cloudflare-propagation-seconds {{ certbot_dns_cloudflare_propagation_seconds }}
      --non-interactive
      --agree-tos
      --expand
      --cert-name {{ certbot_domains[0] }}
      --email {{ certbot_email }}
      {{ certbot_domains | map('regex_replace', '^(.*)$', '-d \1') | join(' ') }}
  register: certbot_result
  changed_when: "'Successfully received certificate' in certbot_result.stdout"

- name: Enable and start certbot renewal timer
  systemd:
    name: certbot.timer
    state: started
    enabled: true
