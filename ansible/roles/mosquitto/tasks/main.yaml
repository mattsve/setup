---
- name: Install mosquitto package
  package:
    name: 
      - mosquitto
      - mosquitto-clients
    state: present

- name: Create local cert directory
  file:
    path: "{{ mosquitto_cert_dir }}"
    state: directory
    owner: mosquitto
    group: mosquitto
    mode: 0750

- name: Copy TLS certificate for mosquitto
  copy:
    src: "{{ mosquitto_letsencrypt_dir }}/fullchain.pem"
    dest: "{{ mosquitto_cert_dir }}/fullchain.pem"
    remote_src: true
    owner: mosquitto
    group: mosquitto
    mode: 0644
  notify: restart mosquitto
  when: mosquitto_tls_enabled | bool

- name: Copy TLS private key for mosquitto
  copy:
    src: "{{ mosquitto_letsencrypt_dir }}/privkey.pem"
    dest: "{{ mosquitto_cert_dir }}/privkey.pem"
    remote_src: true
    owner: mosquitto
    group: mosquitto
    mode: 0640
  notify: restart mosquitto
  when: mosquitto_tls_enabled | bool

- name: Ensure mosquitto password file exists
  copy:
    content: ""
    dest: "{{ mosquitto_passwd_file }}"
    force: false
    owner: mosquitto
    group: mosquitto
    mode: 0640
  when: mosquitto_users | length > 0

- name: Check for existing mosquitto password entries
  command: "grep -q ^{{ item.username }}: {{ mosquitto_passwd_file }}"
  register: mosquitto_existing_users
  loop: "{{ mosquitto_users }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: false
  failed_when: false
  when: mosquitto_users | length > 0

# No community.general module wraps the mosquitto_passwd CLI tool (it ships
# with the mosquitto package itself), and its own hashing is a randomly
# salted PBKDF2-SHA512, so re-running it for a user already in the file
# would always report changed - hence checking for the username above and
# only calling it for the ones still missing, rather than every run.
- name: Add missing mosquitto password entries
  command: "mosquitto_passwd -b {{ mosquitto_passwd_file }} {{ item.item.username }} {{ item.item.password }}"
  loop: "{{ mosquitto_existing_users.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  no_log: true
  notify: restart mosquitto
  when: mosquitto_users | length > 0 and item.rc != 0

- name: Configure mosquitto listeners
  template:
    src: mqtt.conf.j2
    dest: /etc/mosquitto/conf.d/mqtt.conf
    owner: root
    group: root
    mode: 0644
  notify: restart mosquitto

- name: Deploy certbot renewal hook to refresh mosquitto's cert copy
  template:
    src: certbot-deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/mosquitto.sh
    owner: root
    group: root
    mode: 0755
  when: mosquitto_tls_enabled | bool

- name: Enable and start mosquitto
  systemd:
    name: "{{ mosquitto_service }}"
    state: started
    enabled: true
