---
# Must match the cert the certbot role requested for this host.
mosquitto_domain: "{{ inventory_hostname }}.hem.ingenstans.se"

# TLS only if certbot issued a cert (certbot group).
mosquitto_tls_enabled: "{{ 'certbot' in group_names }}"
mosquitto_tls_port: 8883

# Manual, not derived from mosquitto_users: that would lock out anonymous
# clients the moment the first user is added.
mosquitto_allow_anonymous: false

# [{username, password}], from group_vars/mosquitto.yaml (1Password). Opt-in.
mosquitto_users: []
mosquitto_passwd_file: /etc/mosquitto/passwd

# Plaintext listener alongside the TLS one, for units that don't support TLS.
mosquitto_plain_port: 1883

# Where certbot put the live cert.
mosquitto_letsencrypt_dir: "/etc/letsencrypt/live/{{ mosquitto_domain }}"

# Copy readable by mosquitto's user (the letsencrypt archive dir is root-only).
mosquitto_cert_dir: /etc/mosquitto/certs

mosquitto_service: mosquitto
