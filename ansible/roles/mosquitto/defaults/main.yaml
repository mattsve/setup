---
# Domain the TLS cert was issued for - lines up with the cert the certbot
# role already requested for this host.
mosquitto_domain: "{{ inventory_hostname }}.hem.ingenstans.se"

# Only makes sense if certbot issued a cert for this host - derived from
# group membership rather than a separate flag.
mosquitto_tls_enabled: "{{ 'certbot' in group_names }}"
mosquitto_tls_port: 8883

# Manual flag, not derived from mosquitto_users: flipping it the moment a
# user is added would lock out any anonymous client not yet migrated. Now
# false - every client in use has credentials.
mosquitto_allow_anonymous: false

# Populate via group_vars/mosquitto.yaml (1Password-backed) - list of
# {username, password} maps. Empty by default so this stays opt-in.
mosquitto_users: []
mosquitto_passwd_file: /etc/mosquitto/passwd

# Plaintext listener alongside the TLS one, for units that don't support TLS.
mosquitto_plain_port: 1883

# Where certbot put the live cert.
mosquitto_letsencrypt_dir: "/etc/letsencrypt/live/{{ mosquitto_domain }}"

# Local copy mosquitto's unprivileged user can actually read - the
# /etc/letsencrypt archive directory isn't traversable by non-root.
mosquitto_cert_dir: /etc/mosquitto/certs

mosquitto_service: mosquitto
