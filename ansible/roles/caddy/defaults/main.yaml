---
# Caddy reverse proxy defaults

caddy_apt_key_url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
caddy_apt_repo_uri: "https://dl.cloudsmith.io/public/caddy/stable/deb/debian"

# Wildcard cert from the certbot role covering every vhost (see
# host_vars/reverse-proxy01.yaml), not just this host's name.
caddy_domain: "hem.ingenstans.se"
caddy_letsencrypt_dir: "/etc/letsencrypt/live/{{ caddy_domain }}"

# Copy readable by caddy's user (the letsencrypt archive dir is root-only).
caddy_cert_dir: /etc/caddy/certs

caddy_service: caddy

# Routes, supplied per host (host_vars/reverse-proxy01.yaml):
#   - hostname: plex.hem.ingenstans.se
#     backend: 10.1.50.60:32400    # or a list: load-balanced (sticky cookie)
#                                  # with active health checks
#     backend_scheme: http         # optional
#     backend_tls_insecure: false  # optional, for self-signed backend certs
#     backend_host_header: false   # optional, forward the original Host header
#                                  # (needed by e.g. UniFi)
caddy_proxies: []
