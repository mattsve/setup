---
# Nut UPS monitoring defaults

# Nut mode: netserver, standalone, or netclient
nut_mode: netserver

# UPS configuration
nut_ups:
  driver: usbhid-ups
  port: auto
  desc: "Server UPS"

# Nut users for upsd
nut_users:
  - name: monuser
    password: "{{ nut_monuser_password | default('secret') }}"
    acl: "upsmon slave"
  - name: mainuser
    password: "{{ nut_mainuser_password | default('secret2') }}"
    acl: "upsmon master"

# Monitor configuration
nut_monitor_host: localhost
nut_monitor_user: "{{ nut_users[1].name }}"
nut_monitor_password: "{{ nut_users[1].password }}"
nut_monitor_role: master

# upsd.conf settings
nut_listen_address: "0.0.0.0"

# Service names
nut_server_service: nut-server
nut_monitor_service: nut-monitor

# Udev rule source
nut_udev_rule_source: /lib/udev/rules.d/62-nut-usbups.rules
