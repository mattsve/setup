---
# A fresh template's package lists are stale, so refresh before installing.
- name: Install git and openssh-server
  ansible.builtin.apt:
    name:
      - git
      - openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# password '*' (not the default '!') so sshd accepts pubkey logins for it.
- name: Create git user
  user:
    name: "{{ forgejo_user }}"
    system: true
    shell: /bin/bash
    home: "{{ forgejo_home }}"
    comment: Git Version Control
    password: "*"

- name: Create Forgejo directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ forgejo_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ forgejo_work_dir }}", owner: "{{ forgejo_user }}", mode: "0750" }
    - { path: "{{ forgejo_work_dir }}/custom", owner: "{{ forgejo_user }}", mode: "0750" }
    - { path: "{{ forgejo_work_dir }}/data", owner: "{{ forgejo_user }}", mode: "0750" }
    - { path: "{{ forgejo_work_dir }}/log", owner: "{{ forgejo_user }}", mode: "0750" }
    # Forgejo writes its generated secrets into app.ini, so git owns the dir.
    - { path: "{{ forgejo_config_dir }}", owner: "{{ forgejo_user }}", mode: "0750" }

- name: Download Forgejo binary
  get_url:
    url: "{{ forgejo_download_url }}"
    checksum: "sha256:{{ forgejo_download_url }}.sha256"
    dest: /usr/local/bin/forgejo
    owner: root
    group: root
    mode: "0755"
  notify: restart forgejo

- name: Install Forgejo systemd unit
  template:
    src: forgejo.service.j2
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: "0644"
  notify: restart forgejo

- name: Configure Forgejo
  community.general.ini_file:
    path: "{{ forgejo_config }}"
    section: "{{ item.section or omit }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_user }}"
    mode: "0640"
    no_extra_spaces: false
  loop: "{{ forgejo_settings }}"
  notify: restart forgejo

- name: Restrict sshd to the git user
  template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/forgejo.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: restart sshd

- name: Enable and start Forgejo
  systemd:
    name: forgejo
    state: started
    enabled: true
    daemon_reload: true

# Config changes and the first start (which creates the database) must land
# before the CLI is used.
- name: Apply pending restarts
  meta: flush_handlers

- name: List Forgejo admin users
  command: >-
    runuser -u {{ forgejo_user }} --
    /usr/local/bin/forgejo admin user list --admin --config {{ forgejo_config }}
  environment:
    FORGEJO_WORK_DIR: "{{ forgejo_work_dir }}"
  register: forgejo_admins
  changed_when: false

- name: Create Forgejo admin user
  command: >-
    runuser -u {{ forgejo_user }} --
    /usr/local/bin/forgejo admin user create --admin
    --username {{ forgejo_admin_username | quote }}
    --email {{ forgejo_admin_email | quote }}
    --password {{ forgejo_admin_password | quote }}
    --must-change-password=false
    --config {{ forgejo_config }}
  environment:
    FORGEJO_WORK_DIR: "{{ forgejo_work_dir }}"
  no_log: true
  when: forgejo_admin_username not in forgejo_admins.stdout.split()
