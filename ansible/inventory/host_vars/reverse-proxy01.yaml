---
# Wildcards for both domains on one cert, so a new caddy_proxies entry
# below never requires touching the cert. hem.ingenstans.se stays until
# it's fully retired in favor of agb.ingenstans.se (host_vars/dns01.yaml).
certbot_domains:
  - "hem.ingenstans.se"
  - "*.hem.ingenstans.se"
  - "agb.ingenstans.se"
  - "*.agb.ingenstans.se"

caddy_proxies:
  - hostname: plex.hem.ingenstans.se
    backend: "[fd01:eae3:bc39:32:be24:11ff:fe82:633b]:32400"
  - hostname: pve.hem.ingenstans.se
    backend: 10.1.10.2:8006
    backend_scheme: https
    backend_tls_insecure: true
  - hostname: pulse.hem.ingenstans.se
    backend: "[fd01:eae3:bc39:32:be24:11ff:fef7:4b74]:7655"
  - hostname: hass.hem.ingenstans.se
    backend: "[fd01:eae3:bc39:32:216:3eff:fe3e:6e31]:8123"
    backend_scheme: http
  - hostname: plex.agb.ingenstans.se
    backend: "[fd01:eae3:bc39:32:be24:11ff:fe82:633b]:32400"
  - hostname: pve.agb.ingenstans.se
    backend: 10.1.10.2:8006
    backend_scheme: https
    backend_tls_insecure: true
  - hostname: pulse.agb.ingenstans.se
    backend: "[fd01:eae3:bc39:32:be24:11ff:fef7:4b74]:7655"
  - hostname: unifi.agb.ingenstans.se
    backend: cloudkey.management.agb.ingenstans.se
    backend_scheme: https
    backend_tls_insecure: true
    backend_host_header: true
  - hostname: hass.agb.ingenstans.se
    backend: "[fd01:eae3:bc39:32:216:3eff:fe3e:6e31]:8123"
    backend_scheme: http
