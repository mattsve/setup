---
# Both names validate via the same Cloudflare DNS-01 challenge: Cloudflare
# hosts ingenstans.se itself (the only zone it's authoritative for here),
# and both names are subdomains of that, not delegated elsewhere. Split-
# horizon: Technitium (technitium_zones below) serves different, internal-
# only answers for the same names via a separate path.
certbot_domains:
  - dns.agb.ingenstans.se
  - dns01.server.agb.ingenstans.se
technitium_domain: dns.agb.ingenstans.se

# Cluster primary: owns all zones/records/DHCP/blocking, dns02 syncs from it.
technitium_cluster_role: primary
technitium_cluster_domain: dns.agb.ingenstans.se
technitium_node_domain: dns01.server.agb.ingenstans.se
# Created by Technitium itself (PTR records for DHCP leases), so not in
# technitium_zones, but they need to be in the cluster catalog to replicate.
technitium_cluster_extra_zones:
  - 10.1.10.in-addr.arpa
  - 20.1.10.in-addr.arpa
  - 50.1.10.in-addr.arpa
  - 70.1.10.in-addr.arpa
  - 80.1.10.in-addr.arpa
  - 90.1.10.in-addr.arpa
  - 100.1.10.in-addr.arpa
technitium_node_ip_addresses:
  - 10.1.50.2
  # ULA, not GUA: the GUA half moves if the ISP's delegation renumbers.
  - fd01:eae3:bc39:32:be24:11ff:fe7d:ccf0

technitium_zones:
  - zone: agb.ingenstans.se
    type: Primary
  # Being retired in favor of agb.ingenstans.se, but still served for
  # backwards compatibility.
  - zone: hem.ingenstans.se
    type: Primary

  # One zone per VLAN, ordered by VLAN number. Each is its own Primary zone
  # rather than a delegated child of agb.ingenstans.se (this instance is
  # authoritative for all of them, so no NS records are needed), and each
  # VLAN's DHCP leases auto-register in its own zone (dnsUpdates below), which
  # keeps e.g. IoT hosts out of the general-server namespace.
  - zone: management.agb.ingenstans.se # VLAN 10
    type: Primary
  - zone: storage.agb.ingenstans.se # VLAN 20
    type: Primary
  - zone: server.agb.ingenstans.se # VLAN 50
    type: Primary
  - zone: security.agb.ingenstans.se # VLAN 70
    type: Primary
  - zone: iot.agb.ingenstans.se # VLAN 80
    type: Primary
  - zone: guest.agb.ingenstans.se # VLAN 90
    type: Primary
  - zone: main.agb.ingenstans.se # VLAN 100
    type: Primary

# hem.ingenstans.se excluded - being retired, not worth signing.
technitium_dnssec_zones:
  - agb.ingenstans.se
  - server.agb.ingenstans.se
  - management.agb.ingenstans.se
  - storage.agb.ingenstans.se
  - iot.agb.ingenstans.se
  - security.agb.ingenstans.se
  - guest.agb.ingenstans.se
  - main.agb.ingenstans.se

# Friendly agb.ingenstans.se names as CNAMEs into the per-VLAN zones, since
# most backing hosts are DHCP-addressed and have no fixed address to point at.
technitium_records:
  - name: plex.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: pve.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: pulse.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: mqtt.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: mqtt01.server.agb.ingenstans.se
    ttl: 3600
  - name: opnsense.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: opnsense.management.agb.ingenstans.se
    ttl: 3600
  - name: unifi.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: hass.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: k9.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: dreame_vacuum_r2416a.iot.agb.ingenstans.se
    ttl: 3600
  - name: keba-p30.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: keba-p30.security.agb.ingenstans.se
    ttl: 3600
  - name: files.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: l-space.storage.agb.ingenstans.se
    ttl: 3600

  # Static hosts (dns01, pve01, pbs01) aren't DHCP leases, so dnsUpdates never
  # registers them - their A/AAAA records are added by hand.
  - name: dns01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: A
    ipAddress: 10.1.50.2
    ttl: 3600
  - name: dns01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fe7d:ccf0
    ttl: 3600

  - name: dns02.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: A
    ipAddress: 10.1.50.3
    ttl: 3600
  - name: dns02.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fef8:dc3c
    ttl: 3600

  # DHCP-addressed hosts: only the AAAA is added by hand. dnsUpdates registers
  # the lease's A record, but IPv6 is SLAAC-derived, not DHCP-assigned (see
  # CLAUDE.md's IPv6 addressing section).
  - name: reverse-proxy01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fecb:eab5
    ttl: 3600
  - name: plex01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fe82:633b
    ttl: 3600
  - name: mqtt01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fe42:31c4
    ttl: 3600

  - name: pve01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.11
    ttl: 3600
  - name: pve01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a:caff:bfff:fe0b:6fd2
    ttl: 3600
  - name: pve02.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.12
    ttl: 3600
  - name: pve02.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a:caff:bfff:fe0b:3563
    ttl: 3600
  - name: pve03.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.13
    ttl: 3600
  - name: pve03.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a:caff:bfff:fe0b:3279
    ttl: 3600
  - name: pve1.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.2
    ttl: 3600
  - name: pve1.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a:3eec:efff:fe95:f0f8
    ttl: 3600
  - name: pbs01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.3
    ttl: 3600
  - name: pbs01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a:be24:11ff:fea5:71cb
    ttl: 3600
  # JetKVM attached to pve01 (static .21; .21-.23 reserved for per-node KVMs).
  # AAAA is SLAAC EUI-64 from its MAC (30:52:53:05:a1:1c).
  - name: jetkvm-pve01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.21
    ttl: 3600
  - name: jetkvm-pve01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a:3252:53ff:fe05:a11c
    ttl: 3600
  # No AAAA yet for pve02/pve03's: add once their MACs are known.
  - name: jetkvm-pve02.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.22
    ttl: 3600
  - name: jetkvm-pve03.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.23
    ttl: 3600
  # OPNsense's own address on the management VLAN (the gateway).
  - name: opnsense.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.1.10.1
    ttl: 3600
  - name: opnsense.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:a::1
    ttl: 3600

  # l-space lives on the storage VLAN (static lease in the storage scope, so
  # dnsUpdates registers its A record); only the AAAA is added by hand,
  # SLAAC EUI-64 from its MAC (VLAN 20 -> /64 ...:14::/64).
  - name: l-space.storage.agb.ingenstans.se
    zone: storage.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:14:211:32ff:fede:d68d
    ttl: 3600

  - name: l-space.hem.ingenstans.se
    zone: hem.ingenstans.se
    type: CNAME
    cname: l-space.storage.agb.ingenstans.se
    ttl: 3600
  - name: files.hem.ingenstans.se
    zone: hem.ingenstans.se
    type: CNAME
    cname: l-space.storage.agb.ingenstans.se

technitium_apps:
  - name: Query Logs (Sqlite)
    url: https://download.technitium.com/dns/apps/QueryLogsSqliteApp-v9.1.2.zip

technitium_block_list_urls:
  - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi-onlydomains.txt

# Handed out to DHCP clients on every scope, dns01 first so it stays the
# preferred resolver and dns02 (the cluster secondary) is the failover.
# Explicit rather than useThisDnsServer, which would hand out only dns01.
technitium_dhcp_dns_servers:
  - 10.1.50.2
  - 10.1.50.3

# One scope per VLAN, ordered by VLAN number. .2-.49 held back for
# infra/static assignments.
technitium_dhcp_scopes:
  # VLANs other than 50 (where dns01 itself sits) are relayed: requests reach
  # dns01 via OPNsense's per-VLAN IP Helper, not as direct broadcasts.

  # VLAN 10 (management).
  - name: management
    startingAddress: 10.1.10.50
    endingAddress: 10.1.10.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.10.1
    domainName: management.agb.ingenstans.se
    # domainName alone (DHCP option 15) is also what clients used as their
    # search domain, so they'd search only this VLAN's zone rather than the
    # friendlier agb.ingenstans.se - domainSearchList (option 119) is the
    # separate, client-facing search-suffix list. Same split on every scope.
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"
    reservedLeases:
      - hostName: cloudkey
        hardwareAddress: "24:5A:4C:8F:72:4D"
        address: 10.1.10.50
      - hostName: ipmi-pve01
        hardwareAddress: "3C:EC:EF:95:EF:5A"
        address: 10.1.10.51

  # VLAN 20 (storage).
  - name: storage
    startingAddress: 10.1.20.50
    endingAddress: 10.1.20.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.20.1
    domainName: storage.agb.ingenstans.se
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"
    reservedLeases:
      - hostName: l-space
        hardwareAddress: "00:11:32:DE:D6:8D"
        address: 10.1.20.50

  # VLAN 50 (server). Direct broadcasts, no relay.
  - name: server
    startingAddress: 10.1.50.50
    endingAddress: 10.1.50.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.50.1
    # dnsUpdates registers an A/PTR record per lease under this zone. If
    # leases aren't showing up, check the zone's own Dynamic Updates setting
    # in the Technitium console too - the scope option alone may not be enough.
    domainName: server.agb.ingenstans.se
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    # Explicit servers rather than Technitium's own default DNS option (a
    # stale OPNsense address), which is unreachable the same way dns01's own
    # resolver was (see lxc_dns.tf): OPNsense's resolver replies from a
    # different source address than the one queried, so the reply gets
    # silently dropped.
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"

  # VLAN 70 (security).
  - name: security
    startingAddress: 10.1.70.50
    endingAddress: 10.1.70.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.70.1
    domainName: security.agb.ingenstans.se
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"
    reservedLeases:
      - hostName: keba-p30
        hardwareAddress: "00:60:B5:4E:2E:07"
        address: 10.1.70.50

  # VLAN 80 (IoT). See tofu/firewall_dns.tf for the firewall side of relaying.
  - name: iot
    startingAddress: 10.1.80.50
    endingAddress: 10.1.80.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.80.1
    domainName: iot.agb.ingenstans.se
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"
    reservedLeases:
      - hostName: slzb-mr3
        hardwareAddress: "88:57:21:6B:D6:C7"
        address: 10.1.80.50
      - hostName: Pioneer-VSX-LX305-610A64
        hardwareAddress: "00:09:B0:61:0A:64"
        address: 10.1.80.51
      - hostName: zwa-2
        hardwareAddress: "E8:F6:0A:84:A1:23"
        address: 10.1.80.54
      - hostName: WGB256ABSN
        hardwareAddress: "C8:D7:78:B1:48:09"
        address: 10.1.80.55
      - hostName: wlan0
        hardwareAddress: "70:89:76:FE:6A:87"
        address: 10.1.80.58
      - hostName: ESP_4F421E
        hardwareAddress: "BC:FF:4D:4F:42:1E"
        address: 10.1.80.59

  # VLAN 90 (guest).
  - name: guest
    startingAddress: 10.1.90.50
    endingAddress: 10.1.90.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.90.1
    domainName: guest.agb.ingenstans.se
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"

  # VLAN 100 (main).
  - name: main
    startingAddress: 10.1.100.50
    endingAddress: 10.1.100.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.100.1
    domainName: main.agb.ingenstans.se
    domainSearchList:
      - agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"

  # LAN (192.168.1.0/24). Relayed like the other non-server VLANs. No zone, and
  # dnsUpdates is explicitly off: Technitium defaults it to on when omitted.
  - name: lan
    startingAddress: 192.168.1.50
    endingAddress: 192.168.1.250
    subnetMask: 255.255.255.0
    routerAddress: 192.168.1.1
    dnsUpdates: false
    useThisDnsServer: false
    dnsServers: "{{ technitium_dhcp_dns_servers }}"
    # Option 43 (vendor-specific info) for UniFi device adoption, sent only to
    # clients whose vendor class is "ubnt". Sub-option 01, length 4, then the
    # controller's IP (10.1.10.50 = 0A:01:0A:32, the cloudkey's reservation on
    # the management scope).
    vendorInfo:
      - identifier: ubnt
        information: "01:04:0A:01:0A:32"
