---
technitium_zones:
  # hem.ingenstans.se is being retired in favor of agb.ingenstans.se.
  # certbot still issues certs for hem.ingenstans.se for now (that
  # migration happens later, and will need both domains supported for a
  # transition period) but the internal DNS zone itself is no longer needed.
  - zone: agb.ingenstans.se
    type: Primary
  # Independent Primary zone for VLAN 50 hosts, not a delegated subdomain
  # of agb.ingenstans.se - no NS delegation needed since the same
  # Technitium instance is authoritative for both. The server DHCP scope's
  # domainName points here so leases auto-register as
  # <hostname>.server.agb.ingenstans.se. Friendly names in
  # agb.ingenstans.se (e.g. plex.agb.ingenstans.se) are CNAMEs into this
  # zone now that reverse-proxy01 itself has migrated to VLAN 50.
  - zone: server.agb.ingenstans.se
    type: Primary

# Starter set: the hostnames caddy already reverse-proxies (see
# host_vars/reverse-proxy01.yaml's caddy_proxies) all need to resolve
# internally to reverse-proxy01 itself, not wherever public DNS points
# agb.ingenstans.se. Extend this list as more internal names are needed
# (e.g. per-host <hostname>.agb.ingenstans.se records).
#
# CNAMEs rather than A records pointing at a fixed IP: reverse-proxy01 is
# DHCP-addressed on VLAN 50 (see tofu/lxc_reverse_proxy.tf), so its own
# server.agb.ingenstans.se record (auto-registered by the DHCP lease, per
# dnsUpdates below) is the only place its current address needs to live.
technitium_records:
  - name: plex.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: pve.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: pulse.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600

  # dns01 itself is static, not a DHCP lease, so it doesn't get an
  # auto-registered record from the server scope's dnsUpdates - added by
  # hand instead. See CLAUDE.md for the ULA/EUI-64 derivation.
  - name: dns01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: A
    ipAddress: 10.1.50.2
    ttl: 3600
  - name: dns01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:50:be24:11ff:fe7d:ccf0
    ttl: 3600

  # reverse-proxy01's A record comes from the DHCP lease's auto-registration
  # (dnsUpdates only covers A/PTR, per the scope note below) - but its AAAA
  # doesn't, since that's SLAAC-derived, not DHCP-assigned, so it's added by
  # hand here instead, same as dns01's above. See CLAUDE.md for the
  # ULA/EUI-64 derivation.
  - name: reverse-proxy01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:50:be24:11ff:fecb:eab5
    ttl: 3600

# One scope per VLAN (see technitium_dhcp_scopes in
# roles/technitium/defaults/main.yaml for the relay prerequisites on
# OPNsense's side). .2-.49 held back for infra/static assignments.
technitium_dhcp_scopes:
  - name: server
    startingAddress: 10.1.50.50
    endingAddress: 10.1.50.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.50.1
    # Auto-registers an A/PTR record per lease under server.agb.ingenstans.se,
    # named from the client's DHCP hostname option. If leases aren't
    # showing up in the zone, check the zone's own Dynamic Updates
    # setting in the Technitium console too - this scope option alone
    # may not be enough.
    domainName: server.agb.ingenstans.se
    dnsUpdates: true
    # Without this, clients got whatever Technitium's own default DNS
    # option is (10.0.0.1 - AdGuard's LAN address), which is unreachable
    # the same way dns01's own resolver was: AdGuard replies from its
    # VLAN-50-facing address, not the address queried, so the reply gets
    # silently dropped as a mismatch. This makes Technitium itself the
    # DNS server clients get instead.
    useThisDnsServer: true
