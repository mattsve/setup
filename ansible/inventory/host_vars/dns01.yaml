---
# Both names validate via the same Cloudflare DNS-01 challenge: Cloudflare
# hosts ingenstans.se itself (the only zone it's authoritative for here),
# and both names are subdomains of that, not delegated elsewhere. Split-
# horizon: Technitium (technitium_zones below) serves different, internal-
# only answers for the same names via a separate path.
certbot_domains:
  - dns.agb.ingenstans.se
  - dns01.server.agb.ingenstans.se
technitium_domain: dns.agb.ingenstans.se

technitium_zones:
  - zone: agb.ingenstans.se
    type: Primary
  # Being retired in favor of agb.ingenstans.se, but still needed by VLAN 50
  # guests that can't reach OPNsense/AdGuard for these names.
  - zone: hem.ingenstans.se
    type: Primary
  # Independent Primary zone, not delegated - no NS delegation needed since
  # this same Technitium instance is authoritative for both. DHCP leases
  # auto-register here (dnsUpdates below).
  - zone: server.agb.ingenstans.se
    type: Primary
  - zone: management.agb.ingenstans.se
    type: Primary
  # VLAN 80 (IoT): its own namespace rather than sharing server.agb.ingenstans.se,
  # so IoT leases stay out of the general-server namespace.
  - zone: iot.agb.ingenstans.se
    type: Primary

# hem.ingenstans.se excluded - being retired, not worth signing.
technitium_dnssec_zones:
  - agb.ingenstans.se
  - server.agb.ingenstans.se
  - management.agb.ingenstans.se
  - iot.agb.ingenstans.se

# Friendly agb.ingenstans.se names as CNAMEs into server.agb.ingenstans.se,
# since the backing hosts are DHCP-addressed there rather than static.
technitium_records:
  - name: plex.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: pve.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: pulse.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: reverse-proxy01.server.agb.ingenstans.se
    ttl: 3600
  - name: dns.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: dns01.server.agb.ingenstans.se
    ttl: 3600
  - name: mqtt.agb.ingenstans.se
    zone: agb.ingenstans.se
    type: CNAME
    cname: mqtt01.server.agb.ingenstans.se
    ttl: 3600

  # dns01 itself is static, not a DHCP lease, so it gets no auto-registered
  # record from the server scope's dnsUpdates - added by hand instead.
  - name: dns01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: A
    ipAddress: 10.1.50.2
    ttl: 3600
  - name: dns01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fe7d:ccf0
    ttl: 3600

  # AAAA records are added by hand for every host below: dnsUpdates only
  # auto-registers the DHCP lease's A record, and IPv6 is SLAAC-derived, not
  # DHCP-assigned (see CLAUDE.md's IPv6 addressing section).
  - name: reverse-proxy01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fecb:eab5
    ttl: 3600
  - name: plex01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fe82:633b
    ttl: 3600
  - name: mqtt01.server.agb.ingenstans.se
    zone: server.agb.ingenstans.se
    type: AAAA
    ipAddress: fd01:eae3:bc39:32:be24:11ff:fe42:31c4
    ttl: 3600

  - name: pve01.management.agb.ingenstans.se
    zone: management.agb.ingenstans.se
    type: A
    ipAddress: 10.0.0.2
    ttl: 3600

  # l-space is LAN-only (static, not Technitium-managed) - mirrored by hand
  # so plex01's Samba mount can resolve it from VLAN 50.
  - name: l-space.hem.ingenstans.se
    zone: hem.ingenstans.se
    type: A
    ipAddress: 10.0.0.3
    ttl: 3600

# One scope per VLAN. .2-.49 held back for infra/static assignments.
technitium_dhcp_scopes:
  - name: server
    startingAddress: 10.1.50.50
    endingAddress: 10.1.50.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.50.1
    # Auto-registers an A/PTR record per lease under server.agb.ingenstans.se.
    # If leases aren't showing up, check the zone's own Dynamic Updates
    # setting in the Technitium console too - this scope option alone may
    # not be enough.
    domainName: server.agb.ingenstans.se
    dnsUpdates: true
    # Without this, clients got Technitium's own default DNS option
    # (10.0.0.1, AdGuard's LAN address), which is unreachable the same way
    # dns01's own resolver was (see lxc_dns.tf): AdGuard replies from a
    # different source address than the one queried, so the reply gets
    # silently dropped.
    useThisDnsServer: true

  # VLAN 80 (IoT). Unlike the server scope above, dns01 doesn't sit on this
  # VLAN itself - requests reach it relayed via OPNsense's VLAN 80 interface
  # (see tofu/firewall_dns.tf), not as direct broadcasts.
  - name: iot
    startingAddress: 10.1.80.50
    endingAddress: 10.1.80.250
    subnetMask: 255.255.255.0
    routerAddress: 10.1.80.1
    domainName: iot.agb.ingenstans.se
    dnsUpdates: true
    useThisDnsServer: true
