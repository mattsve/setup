---
# Users come from the "mqtt-users" 1Password item (a Secure Note), one
# custom password-type field per user - label is the username, value is the
# password. Adding/removing a user is a 1Password-only edit.
#
# Jinja has no list-comprehension syntax, so the concealed fields are pulled
# as parallel label/value lists, zipped into pairs, and turned into
# {username, password} maps via dict2items. The lookup runs twice since
# stashing its result in a variable would break Ansible's native-type
# detection and turn this into a stringified list.
mosquitto_users: >-
  {{
    dict(
      (lookup('community.general.onepassword_raw', 'mqtt-users', vault='agb').fields
        | selectattr('type', 'equalto', 'CONCEALED') | rejectattr('purpose', 'defined')
        | map(attribute='label') | list)
      | zip(lookup('community.general.onepassword_raw', 'mqtt-users', vault='agb').fields
        | selectattr('type', 'equalto', 'CONCEALED') | rejectattr('purpose', 'defined')
        | map(attribute='value') | list)
    ) | dict2items(key_name='username', value_name='password')
  }}
