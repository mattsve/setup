---
# QEMV VMs aren't reachable via pct exec like LXC, and unlike Proxmox nodes
# they have no DNS record - so ansible_host is derived from the qemu-guest-agent
# facts (want_facts: true in inventory/proxmox.yaml), matching the primary NIC's
# MAC address (proxmox_net0) to the interface it reports and taking its IPv4
# address. This generalizes to any future VM automatically, as long as the
# guest agent is installed and running.
ansible_host: >-
  {{
    proxmox_agent_interfaces
    | selectattr('mac-address', 'equalto', (proxmox_net0.values() | select('match', '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$') | first | lower))
    | map(attribute='ip-addresses')
    | first
    | select('match', '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/')
    | map('regex_replace', '/.*$', '')
    | first
  }}
# VMs provisioned with a cloud-init user_account (tofu's `initialization.user_account`)
# expose that username as the raw `ciuser` config value, surfaced here as
# proxmox_ciuser - so cloud-init VMs are reached as that user (assumed to be
# sudo-capable) automatically, with no per-host override needed. VMs with no
# cloud-init user configured fall back to root.
ansible_user: "{{ proxmox_ciuser | default('root') }}"
