---
# postfix_relay currently applies to every discovered Proxmox node.
# Expressed as a child-group relationship (not a static host list) so newly
# discovered nodes are included automatically.
postfix_relay:
  children:
    proxmox_nodes:

# nut is tied to which physical host has the USB UPS attached, not
# "every proxmox node" - so it's an explicit host list rather than a
# child-group relationship.
nut:
  hosts:
    pve1: {}

# managed_updates is a clean alias for whichever LXC containers/QEMU VMs
# are tagged "managed-updates" in Proxmox (proxmox_tags_managed_updates is
# auto-generated by the dynamic inventory's keyed_groups, named after the
# raw tag - this wraps it so playbooks target a name defined here).
managed_updates:
  children:
    proxmox_tags_managed_updates:

# certbot is opted-in per guest via the "certbot" Proxmox tag, same alias
# pattern as managed_updates: the playbook targets a name defined here
# rather than a plugin implementation detail.
certbot:
  children:
    proxmox_tags_certbot:

# mosquitto is opted-in per guest via the "mosquitto" Proxmox tag, same
# alias pattern as certbot/managed_updates/autologin - deploying it is a
# choice, not something fixed by physical hardware (unlike `nut`), so new
# single-purpose apps should follow this pattern rather than an explicit
# host list.
mosquitto:
  children:
    proxmox_tags_mosquitto:

# autologin is opted-in per LXC container via the "autologin" Proxmox tag,
# same alias pattern as certbot/managed_updates.
autologin:
  children:
    proxmox_tags_autologin:

# unused_services applies to every discovered LXC container - unconditional
# child-group relationship (not opt-in) since the stock Debian LXC template
# ships cron and postfix enabled by default, and neither is used by our
# stack (mail relaying is postfix_relay's job on proxmox_nodes, not this).
unused_services:
  children:
    proxmox_all_lxc:

# ssh is opted-in per LXC container via the "ssh" Proxmox tag, same alias
# pattern as certbot/mosquitto/autologin. unused_services disables sshd on
# every LXC container by default (Ansible reaches them via pct exec, not
# SSH); tagging a guest "ssh" keeps it running instead for guests that
# genuinely need direct SSH access.
ssh:
  children:
    proxmox_tags_ssh:

# plex is opted-in per guest via the "plex" Proxmox tag, same alias pattern
# as certbot/mosquitto/autologin: whichever LXC container or QEMU VM is
# tagged "plex" gets Plex Media Server installed.
plex:
  children:
    proxmox_tags_plex:
