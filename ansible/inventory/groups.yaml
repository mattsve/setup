---
# postfix_relay applies to every discovered Proxmox node - a child-group
# relationship (not a static list) so newly discovered nodes are included
# automatically.
postfix_relay:
  children:
    proxmox_nodes:

# nut is tied to which physical host has the USB UPS attached, not "every
# proxmox node" - an explicit host list rather than a child-group.
nut:
  hosts:
    pve1: {}

# Below: aliases for proxmox_tags_<tag>, auto-generated by the dynamic
# inventory's keyed_groups - wrapping them means playbooks target a name
# defined here, not a plugin implementation detail. Opting a guest in/out
# is just a Proxmox tag edit.
managed_updates:
  children:
    proxmox_tags_managed_updates:

certbot:
  children:
    proxmox_tags_certbot:

mosquitto:
  children:
    proxmox_tags_mosquitto:

autologin:
  children:
    proxmox_tags_autologin:

# Unconditional, unlike the tag-aliases above: applies to every discovered
# LXC container, since the stock Debian template ships cron and postfix
# enabled by default and neither is used by this stack.
unused_services:
  children:
    proxmox_all_lxc:

# Escape hatch, not an activation switch: unused_services disables sshd on
# every LXC by default (Ansible reaches them via pct exec, not SSH);
# tagging a guest "ssh" keeps it running for guests that need direct access.
ssh:
  children:
    proxmox_tags_ssh:

plex:
  children:
    proxmox_tags_plex:

caddy:
  children:
    proxmox_tags_caddy:

technitium:
  children:
    proxmox_tags_technitium:

pulse:
  children:
    proxmox_tags_pulse:
