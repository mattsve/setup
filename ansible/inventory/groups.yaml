---
# Every Proxmox node, including newly discovered ones.
postfix_relay:
  children:
    proxmox_nodes:

# Tied to the physical host with the USB UPS, so an explicit host.
nut:
  hosts:
    pve1: {}

# Below: aliases for the plugin's proxmox_tags_<tag> groups, so playbooks target
# a name defined here. Opting a guest in/out is a Proxmox tag edit.
managed_updates:
  children:
    proxmox_tags_managed_updates:

certbot:
  children:
    proxmox_tags_certbot:

mosquitto:
  children:
    proxmox_tags_mosquitto:

autologin:
  children:
    proxmox_tags_autologin:

# Unconditional: every LXC (the stock template ships unused cron and postfix).
unused_services:
  children:
    proxmox_all_lxc:

# Escape hatch: unused_services disables sshd on every LXC (Ansible uses pct
# exec); tag a guest "ssh" to keep it.
ssh:
  children:
    proxmox_tags_ssh:

plex:
  children:
    proxmox_tags_plex:

caddy:
  children:
    proxmox_tags_caddy:

technitium:
  children:
    proxmox_tags_technitium:

pulse:
  children:
    proxmox_tags_pulse:

# Per-cluster groups. The plugin's `groups` option covers guests but skips
# nodes, so nodes are listed by hand (groups merge across sources). Add a line
# when a node joins a cluster.
cluster_pve1:
  hosts:
    pve1: {}

cluster_agb_pve:
  hosts:
    pve01: {}
    pve02: {}
    pve03: {}
